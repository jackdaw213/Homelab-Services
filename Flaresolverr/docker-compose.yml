services:
    flaresolverr:
        image: ghcr.io/flaresolverr/flaresolverr:latest
        container_name: flaresolverr
        restart: unless-stopped
        environment:
            - LOG_LEVEL=info
            - LOG_HTML=${LOG_HTML:-false}
            - CAPTCHA_SOLVER=${CAPTCHA_SOLVER:-none}
        volumes:
            # host CA store: chrome/curl read the system bundle
            - /etc/ssl/certs:/etc/ssl/certs:ro
            - /etc/ca-certificates/extracted:/etc/ca-certificates/extracted:ro
        ports:
            - "${PORT:-8191}:8191"

networks:
  default:
    name: main_net
    external: true
