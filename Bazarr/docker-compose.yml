services:
    bazarr:
        image: lscr.io/linuxserver/bazarr:latest
        container_name: bazarr
        environment:
        - PUID=1000
        - PGID=1000
        - TZ=Australia/Melbourne
        volumes:
        # host CA store: OpenSSL reads both the bundle and the per-cert files
        - /etc/ssl/certs:/etc/ssl/certs:ro
        - /etc/ca-certificates/extracted:/etc/ca-certificates/extracted:ro
        - ./config:/config
        - /mnt/lab_data/tvseries:/tv
        - /mnt/lab_data/movies:/movies
        ports:
        - 6767:6767
        restart: unless-stopped

networks:
  default:
    name: main_net
    external: true
