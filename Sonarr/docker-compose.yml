services:
    sonarr:
        container_name: sonarr
        restart: unless-stopped
        ports:
            - 8989:8989
        volumes:
            # host CA store: OpenSSL reads both the bundle and the per-cert files
            - /etc/ssl/certs:/etc/ssl/certs:ro
            - /etc/ca-certificates/extracted:/etc/ca-certificates/extracted:ro
            - ./config:/config
            - /mnt/lab_data/tvseries:/tv
            - /mnt/lab_data/downloads:/downloads
        environment:
            - PUID=1000
            - PGID=1000
        image: linuxserver/sonarr

networks:
  default:
    name: main_net
    external: true
